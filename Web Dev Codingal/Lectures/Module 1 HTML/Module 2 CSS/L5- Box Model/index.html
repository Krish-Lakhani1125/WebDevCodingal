<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Example1{
            width: 250px;
            border: 2px solid red;
            padding: 0px 10px 15px 30px;
            /*(top)px (right)px (bottom)px (left)px*/
            /*padding: 30px would put 30 pixels of padding on all sides*/
            margin: 50px;
        }
        .Example2{
            width: 220px;
            background-color: green;
            padding: 60px;
            border: 5px solid black;
            margin: 30px 10px;
            /* (Top and Bottom)px (Left and Right)px */

        }
    </style>
</head>
<body>
    <h1>
        Box Model Example
    </h1>
    <hr>
    <p class="Example1">Example 1</p>
    <hr>
    <p class="Example2">Example 2</p>
    <hr>
</body>
</html>
