<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            text-align: center;
            font-family: monospace;
        }
        #text{
            text-shadow: 5px 5px 3px #CC5500;
            /*(right-offset)px (left-offset)px (fade)px color */
        }
        #box{
            box-shadow: 9px 9px 5px #302934;
            /*(right-offset)px (left-offset)px (fade)px color*/
        }
        #indent{
            text-indent: 50%;
            /*16px or -3em*/
        }
    </style>
</head>
<body>
   <h1 id="text">We can use text-shadow to give shadow to the text itself.</h1>
   
   <h1 id="box">Or use box shadow to give shadow to the element</h1>
   <div>
    <p>This is an example of text indent</p>
   <p id="indent">This is an example of text-indent</p>
   </div>
</body>
</html>
