<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Opacity Example</title>
    <style>
        div {
            width: 500px;
            height: 100px;
            background-color: rgb(255, 0, 174);
            color: white;
            padding: 20px;
            /*margin: 20px;*/
            font-size: 20px;
            font-weight: bold;
        }

        .opacity-100{
            opacity: 1; /* fully visible*/
        }

        .opacity-60{
            opacity:0.6;
        }
        .opacity-50{
            opacity:0.5; /*Semi-transparent*/
        }
        .opacity-30{
            opacity: 0.3;
        }
        .opacity-10{
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div class="opacity-100">Opacity: 1 --default (100%)</div>
    <div class="opacity-60">Opacity: 0.6 (60%)</div>
    <div class="opacity-50">Opacity: 0.5 (50%)</div>
    <div class="opacity-30">Opacity 0.3 (30%)</div>
    <div class="opacity-10"> Opacity: 0.1 (10%)</div>
</body>
</html>
