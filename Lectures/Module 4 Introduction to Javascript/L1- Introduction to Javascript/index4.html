<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Operator</h2>
    <p id="demo"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
    <p id="demo5"></p>

    <script>
        <!--Addition-->
        //*use +, -, *, // operators*//
        var x = 5;
        var y = 2;
        var z = x + y;
        var a = x - y;
        var b = x * y;
        var c = x / y;
        var d = x % y;

document.getElementById("demo").innerHTML = z;
document.getElementById("demo2").innerHTML = a;
document.getElementById("demo3").innerHTML = b;
document.getElementById("demo4").innerHTML = c;
document.getElementById("demo5").innerHTML = d;




    </script>
</body>
</html>
