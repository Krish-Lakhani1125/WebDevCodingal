<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>
    <script>
        var x= "AmAzInG";
        document.write(x.toUpperCase());
        document.write("<br>");
        document.write(x.toLowerCase());
        document.write("<br>");
        document.write("<br>");
        //true or false -- beck if it starts with "this letter"
        document.write(x.startsWith('i'));
        document.write("<br>");

        document.write(x.startsWith('A'));
        document.write("<br>");
        document.write("<br>");

        //Text Method -> returns true or false .text()
        //check if this word exists or not
        var y = "I learnt about Methods";
        //create regular expression = the one u want to check
        var patt = new RegExp("about");
        var result1 = patt.test(x); //false
        var result2 = patt.test(y); //true
        document.write(result1);
        document.write("<br>");
        document.write(result2);
    </script>

    
</body>
</html>
