<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css ">
</head>
<body>
<hr>
<h1>Activity 2</h1>
<div class="container">
    <p>Resize the browser window to see the effect</p>
    <div class="row">
        <!--Size Medium and Extra Small-->
        <div class="col-md-8 col-4" style="background-color: red; border: 1px solid black;">xs</div>
        <div class="col-md-4 col-5" style="background-color: lavender;">.col-xs-5</div>
    </div>
    <div>
        <!--Size Large, Medium and Extra Small-->
        <div class="col-md-12 col-lg-3" style="background-color: rgb(151,21,64);">.col-xs-6 view this</div>

    </div>
    <div class="row" style="background-color: lightcyan;">
        <!--Size Extra Small-->
        <div class="col-6">.col-xs-6</div>
        <div class="col-6">,col-xs-6</div>
    </div>

</div>
        
</body>
</html>
