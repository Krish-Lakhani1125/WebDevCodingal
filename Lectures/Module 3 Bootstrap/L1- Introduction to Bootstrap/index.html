<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css ">
    <style>
        .box {
            border: 1px solid black;
            padding: 20px;
            text-align:center;
            background-color: #f0f0f0;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>3 Equal Columns</h2>
        <div class="row">
            <div class="col-md-4 col-sm-12 box">Column 1</div>
            <div class="col-md-4 box">Column 2</div>
            <div class="col-md-4 box">Column 3</div>
        </div>

        <h2 class="mt-4">Responsive Columns</h2>
        <div class="row">
            <div class="col-sm-6 col-md-3 col-lg-12 box">Small-6 / Medium-3 /Large-12</div>
            <div class="col-sm-6 col-md-9 col-lg-12 box">Small-6 / Medium-9 /Large-12</div>
        </div>
    </div>
    
</body>
</html>
