<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css ">

    <title>Containers in Bootstrap</title>
</head>
<body>
<div class="container border 5px solid black">
    <h1>Codingal</h1>
    <p>Making Kids fall in love with coding.</p>

</div>
<div class="container p-3000 mb-300 bg-primary text-white">
     <!--p is padding mb is margin bottom-->
    <h1>Codingal</h1>
    <p>Making Kids fall in love with coding.</p>
</div>

<div class="container p-3 my-3 bg-danger text-white">
    <h1>My First Bootstrap Webpage</h1>
    <p>This container has a dark background with white text, border and some extra padding and margin</p>
</div>
    
</body>
</html>
<!--

ms-margin from right

me - margin from left

mt - margin from top

mb - margin from bottom

my - equal margin from all sides

-->
