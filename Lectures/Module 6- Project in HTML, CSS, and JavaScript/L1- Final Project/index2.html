<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/996973c893.js"></script>
     <link rel="stylesheet" href=" https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css ">
<script src=" https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js ">
</script>


</head>
<body>
    <!--Main Container-->
    <div class="main-container container">
        <h2 class="text-white">Hello, I'm</h2>
        <h1 class="text-warning m-heading">Codingal Technologies</h1>
        <h2 class="text-white">Coding Education</h2>

    </div>
    <style>
        html {
            scroll-behavior: smooth;

        }
        body {
            background: #252525;
            font-family:"Baloo Tamma 2", cursive;
        }
        /*Main Heading Font */
        .m-heading {
            font-family: "Roboto Slab", serif;
        }
        .text-white {
            color:white;
        }
        /*Main Container Height*/
        .main-container {
            height: 100vh;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('https://t3.ftcdn.net/jpg/02/43/12/34/360_F_243123463_zTooub557xEWABDLk0jJklDyLSGl2jrr.jpg');
            background-attachment: fixed;
            background-size: cover;
        }
        /* aligning items in main row*/
        .main_row {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /*Aligning items in main row*/
        .main_row h1 {
            font-size: 5rem;
        }
        /*Making the main image the size of the screen*/
        .main_row img {
            width: auto;
            height: 100vh;
        }
    </style>

</body>
</html>
