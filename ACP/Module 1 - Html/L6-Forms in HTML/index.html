<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <h1>Job Interview Form</h1>
    </center>
    <form>
        <fieldset>
            <Legend>Application Form</Legend>
            <label>Name:</label><br>
            <input type="text" id="name" placeholder="Enter Name Here"><br><br>


            <label>Last Name:</label><br>
            <input type="text" id="Last Name" placeholder="Enter Last Name Here"><br><br>

            <label>Birthdate: </label><br>
            <input type="date" id="Birthdate"> <br><br>

             <label>Gender</label><br>
             <input type="radio" id="male" name="Gender" value="male">Male<br>

            <input type="radio" id="female" name="Gender" value="female">Female<br><br>

            

            <label>Enter Email:</label><br>
            <input type="text" id="Email" placeholder="Enter Email Here"><br><br>

            <label>Enter Contact Info</label><br>
            <input type="text" id="Contact" placeholder="+#-###-###-####"><br><br>
            

             <label>What Position Would You Like To Apply For?</label><br>
            <input type="radio" id="Mechanical Engineer" name="Job" value="Mechanical Engineer">Mechanical Engineer<br>


            <input type="radio" id="Safety Operator" name="Job" value="Safety Operator">Safety Operator<br>

            <input type="radio" id="Senior Mechanical" name="Job" value="Senior Mechanical Engineer"> Senior Mechanical Engineer<br>

            <input type="radio" id="Vice Operations Manager" name="Job" value="Vice Operations Manager">Vice Operations Manager<br><br><br>


            <label>Tell Us Why You Would Like To Join Our Company:</label><br>
            <input type="text" id="Contact" style="height: 300px; width: 500px;" placeholder="Enter Text:"><br><br>

            <button>Submit</button>
           
           



             

            
        </fieldset>
    </form>

</body>
</html>
