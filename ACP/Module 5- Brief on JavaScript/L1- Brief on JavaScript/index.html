<p>What Time is it in your area?</p>
<input type="text">
 <p id="time"></p>
 <p id="tod"></p>



    <script>
    function myFunction() {
     document.getElementById("op1").innerHTML = " That is nice to hear!";

    }
    function myFunction2() {
     document.getElementById("op2").innerHTML = "Ok, I hope you have a good day!";
    }
    function myFunction3() {
             document.getElementById("op3").innerHTML = "Oh, Sorry to hear that!";

    }
 var tod;
 var time = new Date().getHours();

    if (time < 10) {
                tod = "Right now it is the Morning";

            }

            else if (time < 20) {
                tod = "Right now it is the Afternoon";
            }

            else {
                tod = "Right now it is the evening"
            }
        
            document.getElementById("time").innerHTML = "The time is : " + time + " in my area";
            document.getElementById("tod").innerHTML = tod;


    </script>
