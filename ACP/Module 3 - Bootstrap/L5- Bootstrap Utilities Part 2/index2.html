<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <center>
    <h1>Sign Up or Log in</h1>
    </center>
    <form>
        <fieldset>
            <Legend>Sign Up</Legend>
            <label>Name:</label><br>
            <input type="text" id="name" placeholder="Enter Name Here"><br><br>


            <label>Last Name:</label><br>
            <input type="text" id="Last Name" placeholder="Enter Last Name Here"><br><br>

            <label>Birthdate: </label><br>
            <input type="date" id="Birthdate"> <br><br>

             <label>Gender</label><br>
             <input type="radio" id="male" name="Gender" value="male">Male<br>

            <input type="radio" id="female" name="Gender" value="female">Female<br><br>

            

            <label>Enter Email:</label><br>
            <input type="text" id="Email" placeholder="Enter Email Here"><br><br>
            <button><a href="index.html">Sign Up</a> </button>
        <br>
        Click on Button to go to home page.
            </fieldset>
    </form>
    <br><br><br>



    <form>
        <fieldset>
<legend>Log In</legend>
<label>Username/Name:</Name:></label>
  <input type="text" id="name" placeholder="Enter Name Here"><br><br>
<label>Password:</Name:></label>
  <input type="password" id="contact" pattern="[A-Za-z0-9]+" placeholder="Enter Password"><br>
  Only Put Letters and Numbers<br><br>
  
  <button><a href="index.html">Log In</a></button>
  Click on Button to go to home page.


        </fieldset>
    </form>

</body>
</html>
